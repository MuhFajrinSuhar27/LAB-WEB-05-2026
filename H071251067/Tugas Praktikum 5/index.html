<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantau Tugas Tim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto p-4 sm:p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Pantau Tugas Tim</h1>
      <p class="text-sm text-slate-500">Pilih anggota untuk melihat tugasnya.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <section class="bg-white rounded-xl shadow p-4 md:col-span-1">
        <h2 class="font-semibold mb-3">Anggota Tim</h2>
        <p id="status-anggota" class="text-sm text-slate-500"></p>
        <p id="error-anggota" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2"></p>
        <div id="daftar-anggota" class="flex flex-col gap-2"></div>
      </section>

  
      <section class="bg-white rounded-xl shadow p-4 md:col-span-2">
        <h2 id="judul-tugas" class="font-semibold text-lg mb-1">Tugas</h2>
        <p id="ringkasan" class="text-sm text-slate-500 mb-3">Belum ada anggota dipilih.</p>

        <p id="status-tugas" class="hidden text-sm text-slate-500 mb-2"></p>
        <p id="error-tugas" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2 mb-2"></p>

        
        <form id="form-tugas" class="mb-4" novalidate>
          <div class="flex gap-2">
            <input
              id="input-judul"
              type="text"
              placeholder="Judul tugas baru..."
              autocomplete="off"
              class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            />
            <button
              id="tombol-simpan"
              type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
            >Simpan</button>
          </div>
          <p id="error-form" class="hidden text-sm text-red-600 mt-1"></p>
        </form>

        
        <input
          id="input-cari"
          type="search"
          placeholder="Cari tugas berdasarkan judul..."
          autocomplete="off"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        />

        <p id="pesan-kosong" class="hidden text-sm text-slate-500 italic mb-2"></p>
        <ul id="daftar-tugas" class="flex flex-col gap-2"></ul>
      </section>
    </div>
  </div>

  
  <div
    id="notifikasi"
    class="hidden fixed bottom-4 right-4 bg-green-600 text-white text-sm px-4 py-2 rounded-lg shadow-lg"
  ></div>

  <script src="script.js"></script>
</body>
</html>
