<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Papan Tugas Tim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ["Geist", "ui-sans-serif", "system-ui", "sans-serif"] } } },
    };
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">
  <main class="mx-auto max-w-3xl px-4 py-8">
    <header class="mb-6">
      <h1 class="text-2xl font-bold tracking-tight">Papan Tugas Tim</h1>
      <p class="mt-1 text-sm text-slate-500">Pilih anggota untuk melihat tugas dan progresnya.</p>
    </header>

    <!-- F1: Daftar anggota -->
    <section aria-label="Daftar anggota" class="mb-5">
      <div id="daftar-anggota" class="flex gap-2 overflow-x-auto pb-2"></div>
      <div class="flex items-center gap-3">
        <p id="status-anggota" class="hidden text-sm" role="status"></p>
        <button id="ulang-anggota" type="button"
          class="hidden rounded-md border border-red-300 bg-white px-3 py-1 text-sm font-medium text-red-700 hover:bg-red-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400">
          Coba lagi
        </button>
      </div>
    </section>

    <!-- Placeholder sebelum anggota dipilih -->
    <p id="petunjuk" class="rounded-xl border border-dashed border-slate-300 bg-white px-4 py-10 text-center text-sm text-slate-500">
      Belum ada anggota yang dipilih.
    </p>

    <!-- F2-F5: Tugas anggota -->
    <section id="bagian-tugas" aria-label="Tugas anggota" class="hidden overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="p-5">
        <h2 id="judul-tugas" class="text-xl font-semibold tracking-tight"></h2>
        <p id="ringkasan" class="mt-1 text-sm text-slate-500" aria-live="polite"></p>
        <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-slate-200">
          <div id="bar-progres" class="h-full w-0 rounded-full bg-emerald-600 transition-all duration-300"></div>
        </div>
      </div>

      <div class="space-y-3 border-t border-slate-200 p-5">
        <!-- F3: Pencarian -->
        <input id="cari" type="search" autocomplete="off" aria-label="Cari judul tugas" placeholder="Cari judul tugas"
          class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm placeholder:text-slate-400 focus:border-indigo-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200 disabled:cursor-not-allowed disabled:opacity-60" />

        <!-- F4: Form tambah tugas -->
        <form id="form-tugas" novalidate class="space-y-2">
          <div class="flex gap-2">
            <input id="input-judul" type="text" autocomplete="off" aria-label="Judul tugas baru"
              aria-describedby="error-form" placeholder="Tambah tugas baru, minimal 5 karakter"
              class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm placeholder:text-slate-400 focus:border-indigo-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200 disabled:cursor-not-allowed disabled:opacity-60" />
            <button id="btn-simpan" type="submit"
              class="shrink-0 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60">
              Simpan
            </button>
          </div>
          <p id="error-form" class="hidden text-sm text-red-600" role="alert"></p>
        </form>
      </div>

      <!-- Status loading / error tugas -->
      <div class="flex items-center gap-3 px-5 pb-3">
        <p id="status-tugas" class="hidden text-sm" role="status"></p>
        <button id="ulang-tugas" type="button"
          class="hidden rounded-md border border-red-300 bg-white px-3 py-1 text-sm font-medium text-red-700 hover:bg-red-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400">
          Coba lagi
        </button>
      </div>

      <ul id="daftar-tugas" class="border-t border-slate-100"></ul>
      <p id="kosong" class="hidden px-5 py-8 text-center text-sm text-slate-500"></p>
    </section>
  </main>

  <!-- Notifikasi (F4.5) -->
  <div id="notif" role="status" aria-live="polite"
    class="fixed bottom-4 right-4 hidden rounded-lg bg-emerald-600 px-4 py-3 text-sm font-medium text-white shadow-lg"></div>

  <script src="script.js"></script>
</body>
</html>
