<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantau Tugas Tim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Penanda anggota yang sedang dipilih (ditambah lewat classList.add) */
    .anggota-btn.aktif {
      background-color: #db2777; /* pink-600 */
      color: #ffffff;
      border-color: #db2777;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen">
  <main class="max-w-3xl mx-auto p-4 sm:p-6">
    <h1 class="text-2xl font-bold mb-1">Pantau Tugas Tim AT</h1>
    <p class="text-gray-400 mb-3">Klik nama anggota untuk melihat tugasnya.</p>
    <hr class="border-t border-pink-500 mb-6">

    <!-- F1: Daftar anggota -->
    <section class="bg-neutral-900 rounded-xl shadow p-4 mb-6">
      <h2 class="font-semibold mb-3">Anggota Tim</h2>
      <p id="status-anggota" class="hidden text-sm"></p>
      <div id="daftar-anggota" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- F2-F5: Tugas anggota -->
    <section id="panel-tugas" class="bg-neutral-900 rounded-xl shadow p-4 hidden">
      <h2 id="judul-tugas" class="text-xl font-semibold">Tugas</h2>
      <p id="ringkasan" class="text-sm text-gray-400 mb-3"></p>

      <p id="status-tugas" class="hidden text-sm mb-3"></p>

      <!-- F4: Form tambah tugas -->
      <form id="form-tambah" class="mb-4" novalidate>
        <div class="flex gap-2">
          <input id="input-judul" type="text" placeholder="Judul tugas baru..."
                 class="flex-1 bg-neutral-800 border border-neutral-700 text-white placeholder-neutral-500 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
          <button id="tombol-simpan" type="submit"
                  class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700 disabled:opacity-60">Simpan</button>
        </div>
        <p id="error-form" class="text-sm text-red-400 mt-1"></p>
      </form>

      <!-- Notifikasi sukses -->
      <p id="notifikasi" class="hidden bg-green-900 text-green-200 text-sm rounded-lg px-3 py-2 mb-3"></p>

      <!-- F3: Pencarian -->
      <input id="input-cari" type="text" placeholder="Cari tugas berdasarkan judul..."
             class="w-full bg-neutral-800 border border-neutral-700 text-white placeholder-neutral-500 rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-pink-400">

      <ul id="daftar-tugas" class="space-y-2"></ul>
      <p id="pesan-kosong" class="hidden text-sm text-gray-400 mt-2">Tidak ada tugas yang cocok</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
